<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070a10">
  <title>Ashen Hollow</title>
  <style>
    html, body, #game-root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070a10; }
    body { touch-action: none; overscroll-behavior: none; }
    canvas { display: block; }
    #fatal { display:none; position:fixed; inset:12px; z-index:99999; padding:16px; background:#24090c; color:#ffd8dc; font:16px/1.4 monospace; white-space:pre-wrap; overflow:auto; }
  </style>
  <script>
    function showFatal(message) {
      var el = document.getElementById('fatal');
      if (!el) return;
      el.style.display = 'block';
      el.textContent = 'ASHEN HOLLOW STARTUP ERROR\n\n' + message;
    }
    window.addEventListener('error', function (event) {
      showFatal((event.message || 'Unknown error') + '\n' + (event.filename || '') + ':' + (event.lineno || ''));
    });
    window.addEventListener('unhandledrejection', function (event) {
      showFatal(String(event.reason || 'Unhandled promise rejection'));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-root"></div>
  <div id="fatal"></div>
  <script type="module" src="src/game.js"></script>
</body>
</html>
